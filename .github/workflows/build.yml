          package de.pvmodbus.app

          import java.io.IOException
          import java.net.SocketTimeoutException

          data class Config(
              val profile: Profile,
              val host: String,
              val port: Int,
              val units: List<Int>,
              val mAddr: Int,
              val mInput: Boolean,
              val mType: String,
              val mScale: Double,
              val mUnit: String,
              val mSwap: Boolean
          )

          data class CollectResult(val sections: List<Section>, val errors: List<String>)

          fun collect(sunspec: SunSpecReader, cfg: Config): CollectResult {
              val sections = ArrayList<Section>()
              val errors = ArrayList<String>()
              try {
                  ModbusConnection(cfg.host, cfg.port).use { conn ->
                      for (u in cfg.units) {
                          try {
                              when (cfg.profile) {
                                  Profile.SUNSPEC -> sections.addAll(sunspec.readAll(conn, u))
                                  Profile.HUAWEI -> sections.add(HuaweiProfile.read(conn, u))
                                  Profile.GOODWE -> sections.add(GoodWeProfile.read(conn, u))
                                  Profile.MANUAL -> {
                                      val def = RegDef("m", "Wert", cfg.mAddr, cfg.mType, cfg.mScale, cfg.mUnit)
                                      val rows = RegisterReader.readDefs(conn, u, if (cfg.mInput) 4 else 3, listOf(def), cfg.mSwap)
                                      sections.add(Section("manual", "Gerät $u · Register ${cfg.mAddr}", rows))
                                  }
                              }
                          } catch (e: ModbusException) {
                              errors.add("Unit $u: ${e.message}")
                          } catch (e: IllegalStateException) {
                              errors.add(e.message ?: "Unit $u: Fehler")
                          }
                      }
                  }
              } catch (e: SocketTimeoutException) {
                  errors.add("Zeitüberschreitung – keine Antwort vom Gerät")
              } catch (e: IOException) {
                  errors.add(e.message ?: "Verbindungsfehler")
              }
              return CollectResult(sections, errors)
          }

          fun summaryOf(sections: List<Section>): List<Pair<String, String>> {
              val inv = setOf("101", "102", "103", "111", "112", "113")
              val meter = setOf("201", "202", "203", "204", "211", "212", "213", "214")
              val hw = setOf("huawei")
              val gw = setOf("goodwe")
              val out = ArrayList<Pair<String, String>>()

              findRow(sections, inv, "W")?.let { out.add("Leistung (AC)" to it.text) }
              findRow(sections, hw, "P")?.let { out.add("Leistung (AC)" to it.text) }
              findRow(sections, gw, "ppv")?.let { out.add("Leistung (PV)" to it.text) }
              findRow(sections, inv, "St")?.let { out.add("Status" to it.text) }
              findRow(sections, hw, "St")?.let { out.add("Status" to it.text) }
              findRow(sections, gw, "St")?.let { out.add("Status" to it.text) }
              findRow(sections, hw, "E_day")?.let { out.add("Tagesertrag" to it.text) }
              findRow(sections, gw, "E_day")?.let { out.add("Tagesertrag" to it.text) }
              findRow(sections, inv, "WH")?.let { out.add("Gesamtertrag" to it.text) }
              findRow(sections, hw, "E_total")?.let { out.add("Gesamtertrag" to it.text) }
              findRow(sections, gw, "E_total")?.let { out.add("Gesamtertrag" to it.text) }
              findRow(sections, hw, "SOC")?.let { out.add("Batterie" to it.text) }
              findRow(sections, gw, "SOC")?.let { out.add("Batterie" to it.text) }
              findRow(sections, meter, "W")?.let { out.add("Zähler Wirkleistung" to it.text) }
              findRow(sections, hw, "meter_P")?.let { out.add("Zähler Wirkleistung" to it.text) }
              return out
          }

          fun exportText(sections: List<Section>): String {
              val sb = StringBuilder()
              for (s in sections) {
                  sb.append(s.title).append('\n')
                  for (r in s.rows) sb.append("  ").append(r.label).append(": ").append(r.text).append('\n')
                  sb.append('\n')
              }
              return sb.toString()
          }
