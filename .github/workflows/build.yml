name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projekt anlegen
        run: |
          mkdir -p proj/app/src/main/java/de/pvmodbus/app
          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PvModbus"
          include(":app")
          EOF
          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "de.pvmodbus.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "de.pvmodbus.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.0")
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="PV Modbus"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/ModbusTcp.kt <<'EOF'
          package de.pvmodbus.app

          import java.io.DataInputStream
          import java.io.IOException
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.nio.ByteBuffer

          /** Minimaler Modbus-TCP-Client (Funktionscode 3 = Holding, 4 = Input Register). */
          object ModbusTcp {

              fun readRegisters(
                  host: String,
                  port: Int,
                  unitId: Int,
                  function: Int,
                  address: Int,
                  count: Int,
                  timeoutMs: Int = 3000
              ): IntArray {
                  Socket().use { socket ->
                      socket.connect(InetSocketAddress(host, port), timeoutMs)
                      socket.soTimeout = timeoutMs

                      val req = ByteBuffer.allocate(12)
                      req.putShort(1)
                      req.putShort(0)
                      req.putShort(6)
                      req.put(unitId.toByte())
                      req.put(function.toByte())
                      req.putShort(address.toShort())
                      req.putShort(count.toShort())
                      socket.getOutputStream().apply { write(req.array()); flush() }

                      val input = DataInputStream(socket.getInputStream())
                      val header = ByteArray(7)
                      input.readFully(header)
                      val length = ((header[4].toInt() and 0xFF) shl 8) or (header[5].toInt() and 0xFF)
                      val pdu = ByteArray(length - 1)
                      input.readFully(pdu)

                      val fc = pdu[0].toInt() and 0xFF
                      if (fc and 0x80 != 0) {
                          throw IOException("Modbus-Exception ${pdu[1].toInt() and 0xFF}")
                      }
                      val byteCount = pdu[1].toInt() and 0xFF
                      return IntArray(byteCount / 2) { i ->
                          ((pdu[2 + i * 2].toInt() and 0xFF) shl 8) or
                              (pdu[3 + i * 2].toInt() and 0xFF)
                      }
                  }
              }
          }
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/FroniusSunspec.kt <<'EOF'
          package de.pvmodbus.app

          import java.io.IOException
          import kotlin.math.pow

          data class PvData(
              val model: Int,
              val powerW: Double,
              val acCurrentA: Double,
              val voltageV: Double,
              val freqHz: Double,
              val energyKWh: Double,
              val dcPowerW: Double,
              val tempC: Double,
              val state: Int
          )

          /** Liest den SunSpec-Wechselrichter-Block (Modelle 101-103 Integer, 111-113 Float) von Fronius. */
          object FroniusSunspec {
              private val BASES = listOf(40000, 0, 50000)

              fun stateText(s: Int) = when (s) {
                  1 -> "Aus"; 2 -> "Schlafmodus"; 3 -> "Startet"; 4 -> "Einspeisen (MPPT)"
                  5 -> "Gedrosselt"; 6 -> "Fährt herunter"; 7 -> "Fehler"; 8 -> "Standby"
                  else -> "Unbekannt ($s)"
              }

              fun read(host: String, port: Int, unit: Int): PvData {
                  var last: Exception? = null
                  for (base in BASES) {
                      try {
                          val h = ModbusTcp.readRegisters(host, port, unit, 3, base, 2)
                          if (h.size < 2 || h[0] != 0x5375 || h[1] != 0x6E53) continue
                          var addr = base + 2
                          for (i in 0 until 40) {
                              val hd = ModbusTcp.readRegisters(host, port, unit, 3, addr, 2)
                              val id = hd[0]
                              val len = hd[1]
                              if (id == 0xFFFF || id == 0) break
                              if (id in 101..103 || id in 111..113) {
                                  return parse(
                                      id,
                                      ModbusTcp.readRegisters(host, port, unit, 3, addr, len + 2)
                                  )
                              }
                              addr += len + 2
                          }
                      } catch (e: IOException) {
                          last = e
                      }
                  }
                  throw last ?: IOException(
                      "Kein SunSpec-Wechselrichter gefunden. Modbus TCP im Wechselrichter aktiviert?"
                  )
              }

              private fun s16(v: Int) = v.toShort().toInt()
              private fun sf(v: Int) = if (v == 0x8000) 0 else s16(v)
              private fun scaled(raw: Int, sfReg: Int) = raw * 10.0.pow(sf(sfReg))
              private fun flt(r: IntArray, i: Int) =
                  java.lang.Float.intBitsToFloat((r[i] shl 16) or r[i + 1]).toDouble()

              private fun parse(id: Int, r: IntArray): PvData =
                  if (id in 111..113) {
                      PvData(
                          id, flt(r, 22), flt(r, 2), flt(r, 16), flt(r, 24),
                          flt(r, 32) / 1000.0, flt(r, 38), flt(r, 40), r[48]
                      )
                  } else {
                      val wh =
                          ((r[24].toLong() shl 16) or r[25].toLong()) *
                              10.0.pow(sf(r[26]))
                      PvData(
                          id,
                          scaled(s16(r[14]), r[15]),
                          scaled(r[2], r[6]),
                          scaled(r[10], r[13]),
                          scaled(r[16], r[17]),
                          wh / 1000.0,
                          scaled(s16(r[31]), r[32]),
                          scaled(s16(r[33]), r[37]),
                          r[38]
                      )
                  }
          }
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/MainActivity.kt <<'EOF'
          package de.pvmodbus.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(Modifier.fillMaxSize()) {
                              FroniusScreen()
                          }
                      }
                  }
              }
          }

          private fun fmt(v: Double, unit: String, digits: Int = 1) =
              if (v.isNaN() || v.isInfinite()) "–"
              else "%.${digits}f %s".format(v, unit)

          @Composable
          fun FroniusScreen() {
              var host by remember { mutableStateOf("192.168.1.100") }
              var port by remember { mutableStateOf("502") }
              var unit by remember { mutableStateOf("1") }
              var polling by remember { mutableStateOf(false) }
              var data by remember { mutableStateOf<PvData?>(null) }
              var error by remember { mutableStateOf<String?>(null) }

              LaunchedEffect(polling) {
                  while (polling) {
                      try {
                          data = withContext(Dispatchers.IO) {
                              FroniusSunspec.read(
                                  host.trim(),
                                  port.toInt(),
                                  unit.toInt()
                              )
                          }
                          error = null
                      } catch (e: Exception) {
                          error = e.message ?: e.javaClass.simpleName
                      }
                      delay(5000)
                  }
              }

              Column(
                  Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .statusBarsPadding()
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  Text("Fronius PV-Anlage", fontSize = 22.sp)

                  OutlinedTextField(
                      host,
                      { host = it },
                      label = { Text("IP-Adresse des Wechselrichters") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(
                          port,
                          { port = it },
                          label = { Text("Port") },
                          singleLine = true,
                          modifier = Modifier.weight(1f)
                      )
                      OutlinedTextField(
                          unit,
                          { unit = it },
                          label = { Text("Unit-ID") },
                          singleLine = true,
                          modifier = Modifier.weight(1f)
                      )
                  }

                  Button(
                      onClick = { polling = !polling },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(
                          if (polling) "Stopp"
                          else "Verbinden & alle 5 s lesen"
                      )
                  }

                  error?.let {
                      Text(
                          "Fehler: $it",
                          color = MaterialTheme.colorScheme.error
                      )
                  }

                  data?.let { d ->
                      Card(Modifier.fillMaxWidth()) {
                          Column(Modifier.padding(16.dp)) {
                              Text("Aktuelle Leistung")
                              Text(
                                  fmt(d.powerW / 1000.0, "kW", 2),
                                  fontSize = 36.sp
                              )
                              Text(FroniusSunspec.stateText(d.state))
                          }
                      }

                      Card(Modifier.fillMaxWidth()) {
                          Column(
                              Modifier.padding(16.dp),
                              verticalArrangement = Arrangement.spacedBy(4.dp)
                          ) {
                              Text("AC-Spannung (L1): " + fmt(d.voltageV, "V"))
                              Text("AC-Strom gesamt: " + fmt(d.acCurrentA, "A", 2))
                              Text("Netzfrequenz: " + fmt(d.freqHz, "Hz", 2))
                              Text("DC-Leistung: " + fmt(d.dcPowerW, "W", 0))
                              Text("Temperatur: " + fmt(d.tempC, "°C"))
                              Text("Gesamtertrag: " + fmt(d.energyKWh, "kWh", 1))
                              Text("SunSpec-Modell: ${d.model}")
                          }
                      }
                  }
              }
          }
          EOF

      - name: APK bauen
        run: cd proj && gradle assembleDebug --no-daemon

      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "PV Modbus APK ${{ github.run_number }}" --notes "Debug-APK"
