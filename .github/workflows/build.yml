                          val cols = 4
                          val rowsY = listOf(h * 0.26f to h * 0.345f, h * 0.355f to h * 0.44f)
                          val margin = w * 0.02f
                          val gap = w * 0.006f
                          for (rowY in rowsY) {
                              val ya = rowY.first
                              val yb = rowY.second
                              val la = leftX(ya) + margin
                              val ra = rightX(ya) - margin
                              val lb = leftX(yb) + margin
                              val rb = rightX(yb) - margin
                              for (c in 0 until cols) {
                                  val xa0 = la + (ra - la) * c / cols + gap
                                  val xa1 = la + (ra - la) * (c + 1) / cols - gap
                                  val xb0 = lb + (rb - lb) * c / cols + gap
                                  val xb1 = lb + (rb - lb) * (c + 1) / cols - gap
                                  val panel = Path().apply {
                                      moveTo(xa0, ya)
                                      lineTo(xa1, ya)
                                      lineTo(xb1, yb)
                                      lineTo(xb0, yb)
                                      close()
                                  }
                                  drawPath(panel, panelColor)
                                  drawPath(panel, Color(0x66FFFFFF), style = Stroke(width = 1.5f))
                              }
                          }

                          // Strommast rechts
                          val poleX = w * 0.90f
                          drawLine(Color(0xFF6D4C41), Offset(poleX, h * 0.42f), Offset(poleX, hb), strokeWidth = 6f)
                          drawLine(Color(0xFF6D4C41), Offset(poleX - w * 0.04f, h * 0.45f), Offset(poleX + w * 0.04f, h * 0.45f), strokeWidth = 5f)
                          val poleTop = Offset(poleX - w * 0.04f, h * 0.45f)
                          val houseWire = Offset(hr, h * 0.60f)
                          drawLine(Color(0xFF455A64), poleTop, houseWire, strokeWidth = 3f)

                          // Batterie links
                          val bl = w * 0.06f
                          val bw = w * 0.12f
                          val bt = h * 0.62f
                          val bh = h * 0.20f
                          val batMid = Offset(bl + bw, bt + bh / 2f)
                          val wallMid = Offset(hl, bt + bh / 2f)
                          drawLine(Color(0xFF455A64), batMid, wallMid, strokeWidth = 3f)
                          drawRoundRect(
                              Color(0xFF37474F),
                              topLeft = Offset(bl, bt),
                              size = Size(bw, bh),
                              cornerRadius = CornerRadius(8f, 8f)
                          )
                          drawRect(Color(0xFF37474F), topLeft = Offset(bl + bw * 0.35f, bt - 6f), size = Size(bw * 0.3f, 6f))
                          if (soc != null) {
                              val f = (soc / 100.0).coerceIn(0.0, 1.0).toFloat()
                              val fillColor = if (soc > 30) Color(0xFF66BB6A) else if (soc > 15) Color(0xFFFFA726) else Color(0xFFEF5350)
                              val inner = bh - 8f
                              drawRoundRect(
                                  fillColor,
                                  topLeft = Offset(bl + 4f, bt + 4f + inner * (1f - f)),
                                  size = Size(bw - 8f, inner * f),
                                  cornerRadius = CornerRadius(5f, 5f)
                              )
                          }

                          // Energiefluss
                          if (pv > 30.0) {
                              flowDots(Offset(w * 0.5f, h * 0.45f), Offset(w * 0.5f, h * 0.585f), phase, Color(0xFFFFD54F))
                          }
                          if (grid < -30.0) {
                              flowDots(houseWire, poleTop, phase, Color(0xFF66BB6A))
                          } else if (grid > 30.0) {
                              flowDots(poleTop, houseWire, phase, Color(0xFFFF7043))
                          }
                          if (bat > 30.0) {
                              flowDots(wallMid, batMid, phase, Color(0xFF42A5F5))
                          } else if (bat < -30.0) {
                              flowDots(batMid, wallMid, phase, Color(0xFF42A5F5))
                          }
                      }

                      // Erzeugung (über dem Dach)
                      Column(
                          Modifier
                              .align(Alignment.TopCenter)
                              .padding(top = 8.dp)
                              .clip(RoundedCornerShape(14.dp))
                              .background(Color(0xCC102A43))
                              .padding(horizontal = 14.dp, vertical = 5.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("☀ PV-Erzeugung", fontSize = 11.sp, color = Color.White)
                          Text(kw(live.pvW), fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFFFFD54F))
                      }

                      // Verbrauch (im Haus)
                      Column(
                          Modifier
                              .align(Alignment.Center)
                              .offset(y = 47.dp)
                              .clip(RoundedCornerShape(12.dp))
                              .background(Color(0xE6FFFFFF))
                              .padding(horizontal = 12.dp, vertical = 4.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text("Hausverbrauch", fontSize = 10.sp, color = Color(0xFF607D8B))
                          Text(kw(live.loadW), fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Color(0xFF102A43))
                      }

                      // Status
                      val st = live.status
                      if (st != null) {
                          Text(
                              st,
                              fontSize = 11.sp,
                              color = Color.White,
                              modifier = Modifier
                                  .align(Alignment.TopEnd)
                                  .padding(8.dp)
                                  .clip(RoundedCornerShape(10.dp))
                                  .background(Color(0x99000000))
                                  .padding(horizontal = 8.dp, vertical = 3.dp)
                          )
                      }
                  }

                  Row(
                      Modifier.fillMaxWidth().padding(10.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      val batValue = if (soc != null) String.format(Locale.GERMANY, "%.0f %%", soc) else "–"
                      val batSub = if (live.batChargeW == null) "keine Daten"
                      else if (bat > 30.0) "lädt " + kw(bat)
                      else if (bat < -30.0) "entlädt " + kw(-bat)
                      else "Ruhe"
                      Tile("Batterie", batValue, batSub, Modifier.weight(1f))

                      val gridValue = if (live.gridImportW == null) "–" else kw(Math.abs(grid))
                      val gridSub = if (live.gridImportW == null) "keine Daten"
                      else if (grid > 30.0) "Netzbezug"
                      else if (grid < -30.0) "Einspeisung"
                      else "ausgeglichen"
                      Tile("Netz", gridValue, gridSub, Modifier.weight(1f))

                      Tile("Ertrag heute", live.eDay ?: "–", "gesamt " + (live.eTotal ?: "–"), Modifier.weight(1f))
                  }
              }
          }
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/MainActivity.kt <<'EOF'
          package de.pvmodbus.app

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = lightColorScheme()) {
                          Surface(Modifier.fillMaxSize(), color = Color(0xFFE8EEF4)) { PvScreen() }
                      }
                  }
              }
          }

          private val MANUAL_TYPES = listOf("U16", "I16", "U32", "I32", "F32")

          @Composable
          fun PvScreen() {
              val ctx = LocalContext.current
              val prefs = remember { ctx.getSharedPreferences("pv", Context.MODE_PRIVATE) }
              val sunspec = remember { SunSpecReader(ctx.applicationContext) }
              val clipboard = LocalClipboardManager.current

              var profile by remember { mutableStateOf(Profile.fromName(prefs.getString("profile", "") ?: "")) }
              var host by remember { mutableStateOf(prefs.getString("host", "192.168.1.100") ?: "192.168.1.100") }
              var port by remember { mutableStateOf(prefs.getString("port", "502") ?: "502") }
              var units by remember { mutableStateOf(prefs.getString("units", "1") ?: "1") }
              var interval by remember { mutableStateOf(prefs.getString("interval", "5") ?: "5") }
              var kwp by remember { mutableStateOf(prefs.getString("kwp", "10") ?: "10") }
              var invGrid by remember { mutableStateOf(prefs.getBoolean("invGrid", false)) }
              var invBat by remember { mutableStateOf(prefs.getBoolean("invBat", false)) }

              var mAddr by remember { mutableStateOf("0") }
              var mInput by remember { mutableStateOf(false) }
              var mType by remember { mutableStateOf("U16") }
              var mScale by remember { mutableStateOf("1") }
              var mUnit by remember { mutableStateOf("") }
              var mSwap by remember { mutableStateOf(false) }

              var polling by remember { mutableStateOf(false) }
              var showSettings by remember { mutableStateOf(true) }
              var sections by remember { mutableStateOf<List<Section>>(emptyList()) }
              var errors by remember { mutableStateOf<List<String>>(emptyList()) }
              var updated by remember { mutableStateOf("") }
              val expanded = remember { mutableStateMapOf<String, Boolean>() }

              LaunchedEffect(polling) {
                  while (polling) {
                      val cfg = Config(
                          profile = profile,
                          host = host.trim(),
                          port = port.trim().toIntOrNull() ?: 502,
                          units = units.split(',', ';', ' ').mapNotNull { it.trim().toIntOrNull() }.ifEmpty { listOf(1) },
                          mAddr = mAddr.trim().toIntOrNull() ?: 0,
                          mInput = mInput,
                          mType = mType,
                          mScale = mScale.trim().replace(',', '.').toDoubleOrNull() ?: 1.0,
                          mUnit = mUnit.trim(),
                          mSwap = mSwap
                      )
                      val res = withContext(Dispatchers.IO) {
                          try {
                              collect(sunspec, cfg)
                          } catch (e: Exception) {
                              CollectResult(emptyList(), listOf(e.message ?: e.javaClass.simpleName))
                          }
                      }
                      if (res.sections.isNotEmpty()) {
                          sections = res.sections
                          updated = SimpleDateFormat("HH:mm:ss", Locale.GERMANY).format(Date())
                      }
                      errors = res.errors
                      delay((interval.trim().toLongOrNull() ?: 5L).coerceAtLeast(1L) * 1000L)
                  }
              }

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).statusBarsPadding().padding(12.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Row(
                      Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text("PV-Monitor", fontSize = 22.sp)
                          Text(
                              if (polling) "live" + (if (updated.isNotEmpty()) " · $updated" else "") else "gestoppt",
                              fontSize = 12.sp,
                              color = if (polling) Color(0xFF2E7D32) else Color(0xFF607D8B)
                          )
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = { showSettings = !showSettings }) {
                              Text(if (showSettings) "Zuklappen" else "Einstellungen")
                          }
                          Button(onClick = {
                              if (!polling) {
                                  prefs.edit()
                                      .putString("profile", profile.name)
                                      .putString("host", host)
                                      .putString("port", port)
                                      .putString("units", units)
                                      .putString("interval", interval)
                                      .putString("kwp", kwp)
                                      .putBoolean("invGrid", invGrid)
                                      .putBoolean("invBat", invBat)
                                      .apply()
                                  showSettings = false
                              }
                              polling = !polling
                          }) { Text(if (polling) "Stopp" else "Start") }
                      }
                  }

                  errors.forEach { Text("Fehler: $it", color = MaterialTheme.colorScheme.error, fontSize = 13.sp) }

                  val live = liveOf(sections, invGrid, invBat)
                  HouseView(live, kwp.trim().replace(',', '.').toDoubleOrNull()?.coerceAtLeast(0.1) ?: 10.0)

                  if (showSettings) {
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                          Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Row(
                                  Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  Profile.values().forEach { p ->
                                      FilterChip(
                                          selected = profile == p,
                                          onClick = {
                                              profile = p
                                              port = p.defPort
                                              units = p.defUnit
                                          },
                                          label = { Text(p.short) }
                                      )
                                  }
                              }
                              Text(profile.title, fontSize = 15.sp)
                              Text(profile.hint, fontSize = 12.sp, color = Color(0xFF607D8B))

                              OutlinedTextField(
                                  host, { host = it }, label = { Text("IP-Adresse") },
                                  singleLine = true, modifier = Modifier.fillMaxWidth()
                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  OutlinedTextField(port, { port = it }, label = { Text("Port") }, singleLine = true, modifier = Modifier.weight(1f))
                                  OutlinedTextField(units, { units = it }, label = { Text("Unit-ID(s)") }, singleLine = true, modifier = Modifier.weight(1f))
                                  OutlinedTextField(interval, { interval = it }, label = { Text("Takt (s)") }, singleLine = true, modifier = Modifier.weight(1f))
                              }
                              OutlinedTextField(
                                  kwp, { kwp = it }, label = { Text("Anlagenleistung (kWp, für die Dach-Anzeige)") },
                                  singleLine = true, modifier = Modifier.fillMaxWidth()
                              )
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Switch(invGrid, { invGrid = it })
                                  Text("  Netz-Vorzeichen umkehren", fontSize = 13.sp)
                              }
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Switch(invBat, { invBat = it })
                                  Text("  Batterie-Vorzeichen umkehren", fontSize = 13.sp)
                              }

                              if (profile == Profile.MANUAL) {
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      OutlinedTextField(mAddr, { mAddr = it }, label = { Text("Adresse") }, singleLine = true, modifier = Modifier.weight(1f))
                                      OutlinedTextField(mScale, { mScale = it }, label = { Text("Faktor") }, singleLine = true, modifier = Modifier.weight(1f))
                                      OutlinedTextField(mUnit, { mUnit = it }, label = { Text("Einheit") }, singleLine = true, modifier = Modifier.weight(1f))
                                  }
                                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                      MANUAL_TYPES.forEach { t ->
                                          FilterChip(selected = mType == t, onClick = { mType = t }, label = { Text(t) })
                                      }
                                  }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Checkbox(mInput, { mInput = it })
                                      Text("Input Register (FC 4) statt Holding (FC 3)", fontSize = 13.sp)
                                  }
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Checkbox(mSwap, { mSwap = it })
                                      Text("Wortreihenfolge tauschen (32 Bit)", fontSize = 13.sp)
                                  }
                              }
                          }
                      }
                  }

                  val summary = summaryOf(sections)
                  if (summary.isNotEmpty()) {
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                          Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text("Übersicht", fontSize = 14.sp, color = Color(0xFF607D8B))
                              summary.forEach { item ->
                                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(item.first, fontSize = 15.sp)
                                      Text(item.second, fontSize = 18.sp)
                                  }
                              }
                          }
                      }
                  }

                  if (sections.isNotEmpty()) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("Alle Werte", fontSize = 16.sp)
                          OutlinedButton(onClick = { clipboard.setText(AnnotatedString(exportText(sections))) }) {
                              Text("Alles kopieren")
                          }
                      }
                  }

                  sections.forEach { s ->
                      val open = expanded[s.title] == true
                      Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color.White)) {
                          Column(Modifier.padding(12.dp)) {
                              Text(
                                  (if (open) "▾ " else "▸ ") + s.title + " (" + s.rows.size + ")",
                                  modifier = Modifier.fillMaxWidth().clickable { expanded[s.title] = !open }
                              )
                              if (open) {
                                  s.rows.forEach { r ->
                                      Row(Modifier.fillMaxWidth().padding(top = 4.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                                          Text(r.label, modifier = Modifier.weight(1f), fontSize = 13.sp)
                                          Text(r.text, fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(24.dp))
              }
          }
          EOF
      - name: SunSpec-Modelle laden
        run: |
          git clone --depth 1 https://github.com/sunspec/models.git sunspec-models
          mkdir -p proj/app/src/main/assets/models
          find sunspec-models -type f -name 'model_*.json' -exec cp {} proj/app/src/main/assets/models/ \;
          ls proj/app/src/main/assets/models | wc -l
          test -f proj/app/src/main/assets/models/model_103.json
      - name: APK bauen
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "apk-${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "PV Monitor APK ${{ github.run_number }}" --notes "Debug-APK"
