name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projekt anlegen
        run: |
          mkdir -p proj/app/src/main/java/de/pvmodbus/app
          cat > proj/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PvModbus"
          include(":app")
          EOF
          cat > proj/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > proj/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "de.pvmodbus.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "de.pvmodbus.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.activity:activity-compose:1.9.0")
          }
          EOF
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="PV Monitor"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/Profile.kt <<'EOF'
          package de.pvmodbus.app

          enum class Profile(
              val short: String,
              val title: String,
              val defUnit: String,
              val defPort: String,
              val hint: String
          ) {
              SUNSPEC(
                  "SunSpec", "SunSpec – Fronius, SolarEdge, Kaco, Kostal u. a.", "1", "502",
                  "Liest automatisch alle Datenblöcke. Fronius: Port 502, Unit-ID 1 = Wechselrichter, 200 = Smart Meter (z. B. \"1,200\"). SolarEdge: Port 1502. Kostal Plenticore: meist Port 1502, Unit-ID 71. SunSpec/Modbus TCP muss im Gerät aktiviert sein."
              ),
              HUAWEI(
                  "Huawei", "Huawei SUN2000", "0", "502",
                  "Modbus TCP im Dongle bzw. Wechselrichter aktivieren. Port 502 (Dongle) oder 6607 (direkt am Wechselrichter-WLAN), Unit-ID 0 oder 1."
              ),
              GOODWE(
                  "GoodWe", "GoodWe ET/EH/BT/BH (Hybrid)", "247", "502",
                  "Modbus TCP gibt es nur mit dem neueren WLAN/LAN-Dongle (WLA0000-01-00P). Port 502, Unit-ID 247. Die Serien DT, XS und ES haben eine andere Registerbelegung und sind noch nicht enthalten."
              ),
              MANUAL(
                  "Manuell", "Manuell – beliebiges Register", "1", "502",
                  "Liest ein einzelnes Register eines beliebigen Modbus-TCP-Geräts. Adresse laut Herstellerdokument (0-basiert)."
              );

              companion object {
                  fun fromName(n: String): Profile = values().firstOrNull { it.name == n } ?: SUNSPEC
              }
