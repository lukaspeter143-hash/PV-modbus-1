          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/Format.kt <<'EOF'
          package de.pvmodbus.app

          import java.util.Locale

          fun fmtNum(v: Double): String {
              if (v.isNaN() || v.isInfinite()) return "–"
              val s = if (v == Math.rint(v) && Math.abs(v) < 1e12) {
                  String.format(Locale.US, "%.0f", v)
              } else {
                  String.format(Locale.US, "%.3f", v).trimEnd('0').trimEnd('.')
              }
              return s.replace('.', ',')
          }

          data class Reading(val key: String, val label: String, val text: String, val num: Double?)

          data class Section(val id: String, val title: String, val rows: List<Reading>)
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/ModbusConnection.kt <<'EOF'
          package de.pvmodbus.app

          import java.io.Closeable
          import java.io.DataInputStream
          import java.io.IOException
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.nio.ByteBuffer

          private fun modbusErrorText(code: Int): String = when (code) {
              1 -> "Funktion nicht unterstützt"
              2 -> "Adresse nicht vorhanden"
              3 -> "Ungültiger Wert oder Anzahl"
              4 -> "Gerätefehler"
              6 -> "Gerät beschäftigt"
              11 -> "Gerät antwortet nicht"
              else -> "unbekannt"
          }

          /** Das Gerät hat mit einem Modbus-Fehlercode geantwortet (Verbindung bleibt nutzbar). */
          class ModbusException(val code: Int) : IOException("Modbus-Fehler $code (" + modbusErrorText(code) + ")")

          /** Eine offene Modbus-TCP-Verbindung, mehrere Abfragen nacheinander möglich. */
          class ModbusConnection(host: String, port: Int, timeoutMs: Int = 4000) : Closeable {
              private val socket = Socket()
              private val input: DataInputStream
              private val output: OutputStream
              private var tid = 0

              init {
                  try {
                      socket.connect(InetSocketAddress(host, port), timeoutMs)
                      socket.soTimeout = timeoutMs
                  } catch (e: IOException) {
                      try { socket.close() } catch (x: Exception) { }
                      throw e
                  }
                  input = DataInputStream(socket.getInputStream())
                  output = socket.getOutputStream()
              }

              /** function: 3 = Holding Register, 4 = Input Register */
              fun read(unit: Int, function: Int, address: Int, count: Int): IntArray {
                  tid = (tid + 1) and 0xFFFF
                  val req = ByteBuffer.allocate(12)
                  req.putShort(tid.toShort())
                  req.putShort(0)
                  req.putShort(6)
                  req.put(unit.toByte())
                  req.put(function.toByte())
                  req.putShort(address.toShort())
                  req.putShort(count.toShort())
                  output.write(req.array())
                  output.flush()

                  val header = ByteArray(7)
                  input.readFully(header)
                  val respTid = ((header[0].toInt() and 0xFF) shl 8) or (header[1].toInt() and 0xFF)
                  val length = ((header[4].toInt() and 0xFF) shl 8) or (header[5].toInt() and 0xFF)
                  if (respTid != tid || length < 2) throw IOException("Ungültige Antwort vom Gerät")
                  val pdu = ByteArray(length - 1)
                  input.readFully(pdu)

                  val fc = pdu[0].toInt() and 0xFF
                  if (fc and 0x80 != 0) throw ModbusException(pdu[1].toInt() and 0xFF)
                  val byteCount = pdu[1].toInt() and 0xFF
                  return IntArray(byteCount / 2) { i ->
                      ((pdu[2 + i * 2].toInt() and 0xFF) shl 8) or (pdu[3 + i * 2].toInt() and 0xFF)
                  }
              }

              fun readChunked(unit: Int, function: Int, address: Int, count: Int, chunk: Int = 100): IntArray {
                  val out = IntArray(count)
                  var done = 0
                  while (done < count) {
                      val n = minOf(chunk, count - done)
                      val part = read(unit, function, address + done, n)
                      if (part.size < n) throw IOException("Antwort zu kurz")
                      System.arraycopy(part, 0, out, done, n)
                      done += n
                  }
                  return out
              }

              override fun close() {
                  try { socket.close() } catch (e: Exception) { }
              }
          }
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/SunSpec.kt <<'EOF'
          package de.pvmodbus.app

          import android.content.Context
          import org.json.JSONObject

          /**
           * Liest ALLE SunSpec-Datenblöcke eines Geräts. Die Beschreibung jedes Blocks (Namen, Einheiten,
           * Skalierung, Aufzählungen) kommt aus den offiziellen SunSpec-Modelldateien in assets/models.
           */
          class SunSpecReader(private val context: Context) {
              private val cache = HashMap<Int, JSONObject?>()

              private fun model(id: Int): JSONObject? {
                  if (cache.containsKey(id)) return cache[id]
                  val def: JSONObject? = try {
                      context.assets.open("models/model_$id.json").bufferedReader().use { JSONObject(it.readText()) }
                  } catch (e: Exception) {
                      null
                  }
                  cache[id] = def
                  return def
              }

              fun readAll(conn: ModbusConnection, unit: Int): List<Section> {
                  val sections = ArrayList<Section>()
                  var found = -1
                  for (b in intArrayOf(40000, 0, 50000)) {
                      try {
                          val h = conn.read(unit, 3, b, 2)
                          if (h.size >= 2 && h[0] == 0x5375 && h[1] == 0x6E53) {   // "SunS"
                              found = b
                              break
                          }
                      } catch (e: ModbusException) {
                          // nächste Startadresse probieren
                      }
                  }
                  if (found < 0) {
                      throw IllegalStateException("Unit $unit: keine SunSpec-Kennung gefunden (Modbus/SunSpec im Gerät aktiviert? Unit-ID richtig?)")
                  }

                  var addr = found + 2
                  var guard = 0
                  while (guard < 80) {
                      guard++
                      val hd: IntArray = try {
                          conn.read(unit, 3, addr, 2)
                      } catch (e: ModbusException) {
                          break
                      }
                      if (hd.size < 2) break
                      val id = hd[0]
                      val len = hd[1]
                      if (id == 0xFFFF || id == 0 || len == 0) break
                      val data: IntArray? = try {
                          conn.readChunked(unit, 3, addr, len + 2)
                      } catch (e: ModbusException) {
                          null
                      }
                      if (data != null) sections.add(decodeModel(id, data, unit))
                      addr += len + 2
                  }
                  if (sections.isEmpty()) throw IllegalStateException("Unit $unit: keine Datenblöcke gefunden")
                  return sections
              }

              private fun decodeModel(id: Int, r: IntArray, unit: Int): Section {
                  val prefix = "Gerät $unit · "
                  val def = model(id)
                  if (def == null) {
                      val info = Reading("", "Rohdaten", "${r.size - 2} Register (keine Beschreibung vorhanden)", null)
                      return Section(id.toString(), prefix + "Modell $id", listOf(info))
                  }
                  val group = def.getJSONObject("group")
                  val title = group.optString("label", "").ifEmpty { group.optString("name", "Modell $id") }
                  val rows = ArrayList<Reading>()
                  decodeGroup(group, r, 0, HashMap<String, Long>(), rows, "")
                  return Section(id.toString(), prefix + title, rows)
              }

              private fun defaultSize(type: String): Int = when (type) {
                  "int32", "uint32", "acc32", "enum32", "bitfield32", "float32", "ipaddr" -> 2
                  "int64", "uint64", "acc64", "float64", "eui48" -> 4
                  "ipv6addr" -> 8
                  else -> 1
              }

              private fun resolveCount(g: JSONObject, vals: Map<String, Long>, remaining: Int): Int {
                  val c = g.opt("count")
                  var n = 1
                  if (c is Int) {
                      if (c > 0) {
                          n = c
                      } else {
                          var size = 0
                          val pts = g.optJSONArray("points")
                          if (pts != null) {
                              for (i in 0 until pts.length()) {
                                  val p = pts.getJSONObject(i)
                                  size += p.optInt("size", defaultSize(p.optString("type", "uint16")))
                              }
                          }
                          n = if (size > 0) remaining / size else 0
                      }
                  } else if (c is String) {
                      val v = vals[c]
                      n = if (v != null) v.toInt() else 0
                  }
                  return if (n < 0) 0 else if (n > 64) 64 else n
              }

              private fun decodeGroup(
                  g: JSONObject, r: IntArray, start: Int,
                  parentVals: Map<String, Long>, rows: MutableList<Reading>, prefix: String
              ): Int {
                  val vals = HashMap<String, Long>(parentVals)
                  var off = start
                  val points = g.optJSONArray("points")
                  if (points != null) {
                      for (i in 0 until points.length()) {
                          val p = points.getJSONObject(i)
                          val type = p.optString("type", "uint16")
                          val name = p.optString("name", "")
                          val size = p.optInt("size", defaultSize(type))
                          if (off + size > r.size) return r.size
                          if (type != "pad" && name != "ID" && name != "L") {
                              val row = decodePoint(p, type, name, size, r, off, vals, prefix)
                              if (row != null) rows.add(row)
                          }
                          off += size
                      }
                  }
                  val subs = g.optJSONArray("groups")
                  if (subs != null) {
                      for (i in 0 until subs.length()) {
                          val sg = subs.getJSONObject(i)
                          val sgName = sg.optString("name", "group")
                          val cnt = resolveCount(sg, vals, r.size - off)
                          for (k in 1..cnt) {
                              if (off >= r.size) break
                              val p2 = if (cnt > 1) "$prefix$sgName $k · " else "$prefix$sgName · "
                              off = decodeGroup(sg, r, off, vals, rows, p2)
                          }
                      }
                  }
                  return off
              }

              private fun decodePoint(
                  p: JSONObject, type: String, name: String, size: Int, r: IntArray, off: Int,
                  vals: HashMap<String, Long>, prefix: String
              ): Reading? {
                  val label = prefix + p.optString("label", "").ifEmpty { name }
                  val units = p.optString("units", "")
                  val symbols = p.optJSONArray("symbols")

                  var raw = 0L
                  var na = false
                  var dbl = Double.NaN
                  var numeric = true
                  when (type) {
                      "int16", "sunssf" -> {
                          raw = r[off].toShort().toLong()
                          na = r[off] == 0x8000
                      }
                      "uint16", "count", "enum16" -> {
                          raw = r[off].toLong()
                          na = r[off] == 0xFFFF
                      }
                      "acc16", "bitfield16" -> {
                          raw = r[off].toLong()
                      }
                      "int32" -> {
                          val v = (r[off].toLong() shl 16) or r[off + 1].toLong()
                          raw = v.toInt().toLong()
                          na = v == 0x80000000L
                      }
                      "uint32", "enum32" -> {
                          val v = (r[off].toLong() shl 16) or r[off + 1].toLong()
                          raw = v
                          na = v == 0xFFFFFFFFL
                      }
                      "acc32", "bitfield32" -> {
                          raw = (r[off].toLong() shl 16) or r[off + 1].toLong()
                      }
                      "int64", "uint64", "acc64" -> {
                          var v = 0L
                          for (k in 0 until 4) v = (v shl 16) or r[off + k].toLong()
                          raw = v
                          na = (type == "int64" && v == Long.MIN_VALUE) || (type == "uint64" && v == -1L)
                      }
                      "float32" -> {
                          dbl = java.lang.Float.intBitsToFloat((r[off] shl 16) or r[off + 1]).toDouble()
                          na = dbl.isNaN()
                      }
                      "float64" -> {
                          var v = 0L
                          for (k in 0 until 4) v = (v shl 16) or r[off + k].toLong()
                          dbl = java.lang.Double.longBitsToDouble(v)
                          na = dbl.isNaN()
                      }
                      else -> numeric = false
                  }

                  if (numeric && type != "float32" && type != "float64" && name.isNotEmpty()) vals[name] = raw
                  if (type == "sunssf") return null

                  if (type == "string") {
                      val sb = StringBuilder()
                      for (k in 0 until size) {
                          val w = r[off + k]
                          val a = (w shr 8) and 0xFF
                          val b = w and 0xFF
                          if (a != 0) sb.append(a.toChar())
                          if (b != 0) sb.append(b.toChar())
                      }
                      val s = sb.toString().trim()
                      return Reading(name, label, if (s.isEmpty()) "–" else s, null)
                  }

                  if (!numeric) {
                      val hex = (0 until size).joinToString("") { String.format("%04X", r[off + it]) }
                      return Reading(name, label, hex, null)
                  }

                  if (type.startsWith("enum")) {
                      var nm: String? = null
                      if (symbols != null) {
                          for (k in 0 until symbols.length()) {
                              val sy = symbols.getJSONObject(k)
                              if (sy.optLong("value", -1L) == raw) {
                                  nm = sy.optString("name")
                                  break
                              }
                          }
                      }
                      val t = if (na) "–" else if (nm != null) "$nm ($raw)" else raw.toString()
                      return Reading(name, label, t, if (na) null else raw.toDouble())
                  }

                  if (type.startsWith("bitfield")) {
                      val names = ArrayList<String>()
                      if (symbols != null) {
                          for (k in 0 until symbols.length()) {
                              val sy = symbols.getJSONObject(k)
                              val bit = sy.optInt("value", -1)
                              if (bit in 0..63 && ((raw shr bit) and 1L) == 1L) names.add(sy.optString("name"))
                          }
                      }
                      val hex = String.format("0x%X", raw)
                      val t = if (names.isEmpty()) hex else hex + " (" + names.joinToString(", ") + ")"
                      return Reading(name, label, t, raw.toDouble())
                  }

                  if (na) return Reading(name, label, "–", null)

                  var value = if (type == "float32" || type == "float64") dbl else raw.toDouble()
                  val sfAny = p.opt("sf")
                  var sf = 0
                  if (sfAny is String) {
                      val s = vals[sfAny]
                      if (s != null && s != -32768L) sf = s.toInt()
                  } else if (sfAny is Int) {
                      sf = sfAny
                  }
                  if (sf != 0) value *= Math.pow(10.0, sf.toDouble())

                  val txt = fmtNum(value) + (if (units.isNotEmpty()) " $units" else "")
                  return Reading(name, label, txt, value)
              }
          }
          EOF
          cat > proj/app/src/main/java/de/pvmodbus/app/RegisterReader.kt <<'EOF'
          package de.pvmodbus.app

          /** Beschreibung eines einzelnen Registers (für Hersteller ohne SunSpec). */
          data class RegDef(
              val key: String,
              val label: String,
              val addr: Int,
              val type: String,          // U16, I16, U32, I32, F32, H16, STR
              val scale: Double = 1.0,
              val unit: String = "",
              val len: Int = 0           // nur für STR: Anzahl Register
          )

          object RegisterReader {
              private fun regCount(d: RegDef): Int = when (d.type) {
                  "U32", "I32", "F32" -> 2
                  "STR" -> d.len
                  else -> 1
              }

              private fun w32(r: IntArray, off: Int, swap: Boolean): Long {
                  val a = if (swap) r[off + 1] else r[off]
                  val b = if (swap) r[off] else r[off + 1]
                  return (a.toLong() shl 16) or b.toLong()
              }

              private fun decode(d: RegDef, r: IntArray, off: Int, swap: Boolean): Reading {
                  val n = regCount(d)
                  if (n <= 0 || off < 0 || off + n > r.size) return Reading(d.key, d.label, "n/v", null)
                  if (d.type == "STR") {
                      val sb = StringBuilder()
                      for (k in 0 until n) {
                          val w = r[off + k]
                          val a = (w shr 8) and 0xFF
                          val b = w and 0xFF
                          if (a != 0) sb.append(a.toChar())
                          if (b != 0) sb.append(b.toChar())
                      }
                      val s = sb.toString().trim()
                      return Reading(d.key, d.label, if (s.isEmpty()) "–" else s, null)
                  }
                  if (d.type == "H16") {
                      return Reading(d.key, d.label, String.format("0x%04X", r[off]), r[off].toDouble())
                  }
                  val v: Double = when (d.type) {
                      "U16" -> r[off].toDouble()
                      "I16" -> r[off].toShort().toDouble()
                      "U32" -> (w32(r, off, swap) and 0xFFFFFFFFL).toDouble()
                      "I32" -> w32(r, off, swap).toInt().toDouble()
                      "F32" -> java.lang.Float.intBitsToFloat(w32(r, off, swap).toInt()).toDouble()
                      else -> Double.NaN
                  }
                  val value = v * d.scale
                  val txt = fmtNum(value) + (if (d.unit.isNotEmpty() && !value.isNaN()) " " + d.unit else "")
                  return Reading(d.key, d.label, txt, value)
              }

              /** Liest alle Register; benachbarte werden zu einer Abfrage zusammengefasst. */
              fun readDefs(
                  conn: ModbusConnection, unit: Int, function: Int,
                  defs: List<RegDef>, swap: Boolean = false
              ): List<Reading> {
                  val sorted = defs.sortedBy { it.addr }
                  val result = HashMap<String, Reading>()
                  var i = 0
                  while (i < sorted.size) {
                      val start = sorted[i].addr
                      var end = start + regCount(sorted[i])
                      var j = i + 1
                      while (j < sorted.size &&
                          sorted[j].addr + regCount(sorted[j]) - start <= 100 &&
                          sorted[j].addr - end <= 16
                      ) {
                          end = maxOf(end, sorted[j].addr + regCount(sorted[j]))
                          j++
                      }
                      val data: IntArray? = try {
                          conn.read(unit, function, start, end - start)
                      } catch (e: ModbusException) {
                          null
                      }
                      for (k in i until j) {
                          val d = sorted[k]
                          if (data != null) {
                              result[d.key] = decode(d, data, d.addr - start, swap)
                          } else {
                              try {
                                  val one = conn.read(unit, function, d.addr, regCount(d))
                                  result[d.key] = decode(d, one, 0, swap)
                              } catch (e: ModbusException) {
                                  result[d.key] = Reading(d.key, d.label, "n/v", null)
                              }
                          }
                      }
                      i = j
                  }
                  return defs.map { result[it.key] ?: Reading(it.key, it.label, "n/v", null) }
              }
          }

          object HuaweiProfile {
              private val defs = listOf(
                  RegDef("model", "Modell", 30000, "STR", len = 15),
                  RegDef("sn", "Seriennummer", 30015, "STR", len = 10),
                  RegDef("pv1_v", "PV1 Spannung", 32016, "I16", 0.1, "V"),
                  RegDef("pv1_i", "PV1 Strom", 32017, "I16", 0.01, "A"),
                  RegDef("pv2_v", "PV2 Spannung", 32018, "I16", 0.1, "V"),
                  RegDef("pv2_i", "PV2 Strom", 32019, "I16", 0.01, "A"),
                  RegDef("pv3_v", "PV3 Spannung", 32020, "I16", 0.1, "V"),
                  RegDef("pv3_i", "PV3 Strom", 32021, "I16", 0.01, "A"),
                  RegDef("pv4_v", "PV4 Spannung", 32022, "I16", 0.1, "V"),
                  RegDef("pv4_i", "PV4 Strom", 32023, "I16", 0.01, "A"),
                  RegDef("dc_power", "DC-Eingangsleistung", 32064, "I32", 1.0, "W"),
                  RegDef("uab", "Netzspannung L1-L2", 32066, "U16", 0.1, "V"),
                  RegDef("ubc", "Netzspannung L2-L3", 32067, "U16", 0.1, "V"),
                  RegDef("uca", "Netzspannung L3-L1", 32068, "U16", 0.1, "V"),
                  RegDef("ua", "Spannung Phase L1", 32069, "U16", 0.1, "V"),
