              private fun workMode(c: Int): String = when (c) {
                  0 -> "Wartend"
                  1 -> "Netzbetrieb"
                  2 -> "Inselbetrieb"
                  3 -> "Fehler"
                  4 -> "Firmware-Update"
                  5 -> "Prüfung"
                  else -> "Modus $c"
              }

              private fun batMode(c: Int): String = when (c) {
                  0 -> "Keine Batterie"
                  1 -> "Standby"
                  2 -> "Entladen"
                  3 -> "Laden"
                  else -> "Modus $c"
              }

              fun read(conn: ModbusConnection, unit: Int): Section {
                  val raw = RegisterReader.readDefs(conn, unit, 3, defs)
                  val byKey = HashMap<String, Reading>()
                  for (r in raw) byKey[r.key] = r

                  val rows = ArrayList<Reading>()
                  var sum = 0.0
                  var any = false
                  for (k in listOf("ppv1", "ppv2", "ppv3", "ppv4")) {
                      val n = byKey[k]?.num
                      if (n != null) {
                          sum += n
                          any = true
                      }
                  }
                  if (any) rows.add(Reading("ppv", "PV-Leistung gesamt", fmtNum(sum) + " W", sum))

                  for (r in raw) {
                      val n = r.num
                      if (r.key == "St" && n != null) {
                          rows.add(Reading(r.key, r.label, workMode(n.toInt()), n))
                      } else if (r.key == "bat_mode" && n != null) {
                          rows.add(Reading(r.key, r.label, batMode(n.toInt()), n))
                      } else {
                          rows.add(r)
                      }
                  }
                  return Section("goodwe", "Gerät $unit · GoodWe ET/EH/BT/BH", rows)
              }
          }
