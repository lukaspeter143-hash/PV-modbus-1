          package de.pvmodbus.app

          /** Einheitliche Livewerte. Netz: + = Bezug. Batterie: + = laden. */
          data class LiveData(
              val pvW: Double?,
              val loadW: Double?,
              val gridImportW: Double?,
              val batChargeW: Double?,
              val soc: Double?,
              val status: String?,
              val eDay: String?,
              val eTotal: String?
          )

          fun findRow(sections: List<Section>, ids: Set<String>, key: String): Reading? {
              for (s in sections) {
                  if (s.id in ids) {
                      for (r in s.rows) {
                          if (r.key == key) return r
                      }
                  }
              }
              return null
          }

          fun liveOf(sections: List<Section>, invertGrid: Boolean, invertBat: Boolean): LiveData {
              val inv = setOf("101", "102", "103", "111", "112", "113")
              val meter = setOf("201", "202", "203", "204", "211", "212", "213", "214")
              val hw = setOf("huawei")
              val gw = setOf("goodwe")

              fun num(ids: Set<String>, key: String): Double? = findRow(sections, ids, key)?.num
              fun txt(ids: Set<String>, key: String): String? = findRow(sections, ids, key)?.text

              val pv: Double? = num(inv, "W") ?: num(hw, "P") ?: num(gw, "ppv")

              var grid: Double? = null
              val sunMeter = num(meter, "W")
              val hwMeter = num(hw, "meter_P")
              val gwGrid = num(gw, "grid")
              if (sunMeter != null) grid = sunMeter
              else if (hwMeter != null) grid = -hwMeter
              else if (gwGrid != null) grid = -gwGrid
              if (invertGrid && grid != null) grid = -grid

              var bat: Double? = null
              val hwBat = num(hw, "bat_P")
              val gwBat = num(gw, "bat_P")
              if (hwBat != null) bat = hwBat
              else if (gwBat != null) bat = -gwBat
              if (invertBat && bat != null) bat = -bat

              var load: Double? = num(gw, "load")
              if (load == null && pv != null && grid != null) {
                  val l = pv + grid - (bat ?: 0.0)
                  load = if (l < 0.0) 0.0 else l
              }

              val soc = num(hw, "SOC") ?: num(gw, "SOC")
              val status = txt(inv, "St") ?: txt(hw, "St") ?: txt(gw, "St")
              val eDay = txt(hw, "E_day") ?: txt(gw, "E_day")
              val wh = num(inv, "WH")
              val eTotal = if (wh != null) fmtNum(wh / 1000.0) + " kWh" else (txt(hw, "E_total") ?: txt(gw, "E_total"))

              return LiveData(pv, load, grid, bat, soc, status, eDay, eTotal)
          }
