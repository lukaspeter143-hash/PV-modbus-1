                  0x0000 -> "Standby: Initialisierung"
                  0x0001 -> "Standby: Isolationsprüfung"
                  0x0002 -> "Standby: Einstrahlungserkennung"
                  0x0003 -> "Standby: Netzprüfung"
                  0x0100 -> "Startet"
                  0x0200 -> "Netzbetrieb"
                  0x0201 -> "Netzbetrieb: Leistung begrenzt"
                  0x0202 -> "Netzbetrieb: Selbstbegrenzung"
                  0x0300 -> "Abschaltung: Fehler"
                  0x0301 -> "Abschaltung: Befehl"
                  0x0308 -> "Abschaltung: zu wenig Eingangsleistung"
                  0xA000 -> "Standby: keine Einstrahlung"
                  else -> String.format("Status 0x%04X", code)
              }

              fun read(conn: ModbusConnection, unit: Int): Section {
                  val rows = RegisterReader.readDefs(conn, unit, 3, defs).map {
                      val c = it.num
                      if (it.key == "St" && c != null) Reading(it.key, it.label, statusText(c.toInt()), c) else it
                  }
                  return Section("huawei", "Gerät $unit · Huawei SUN2000", rows)
              }
